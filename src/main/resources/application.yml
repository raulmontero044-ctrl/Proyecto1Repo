spring:
  application:
    name: facturacion
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/facturacion}
    username: ${DB_USERNAME:facturacion}
    password: ${DB_PASSWORD:facturacion}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
facturacion:
  administrador-inicial:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
