services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: facturacion
      MARIADB_USER: facturacion
      MARIADB_PASSWORD: facturacion
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
