services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: facturacion
      MARIADB_USER: facturacion
      MARIADB_PASSWORD: facturacion
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: facturacion:0.0.1-SNAPSHOT
    environment:
      DB_URL: jdbc:mariadb://mariadb:3306/facturacion
      DB_USERNAME: facturacion
      DB_PASSWORD: facturacion
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb-data:
